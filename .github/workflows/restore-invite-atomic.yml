name: restore-invite-atomic
on:
  push:
    paths:
      - '.github/workflows/RESTORE_INVITE_TRIGGER'
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rbac-isolation-tests-and-org-admin-escalation
          fetch-depth: 0
      - name: Restore from c2fb089 and apply patches
        run: |
          git show c2fb089:apps/api/src/modules/auth/auth.service.ts > apps/api/src/modules/auth/auth.service.ts
          git show c2fb089:apps/api/src/modules/users/users.service.ts > apps/api/src/modules/users/users.service.ts
          git show c2fb089:apps/api/src/modules/auth/auth.service.spec.ts > apps/api/src/modules/auth/auth.service.spec.ts
          patch -p1 < tmp-restore/auth.fixed.patch
          patch -p1 < tmp-restore/users.fixed.patch
          patch -p1 < tmp-restore/spec.fixed.patch
          wc -c apps/api/src/modules/auth/auth.service.ts apps/api/src/modules/users/users.service.ts apps/api/src/modules/auth/auth.service.spec.ts
          grep -n 'updateMany' apps/api/src/modules/auth/auth.service.ts | head
          grep -n 'TransactionClient' apps/api/src/modules/users/users.service.ts | head
      - name: Commit restore and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/modules/auth/auth.service.ts apps/api/src/modules/users/users.service.ts apps/api/src/modules/auth/auth.service.spec.ts
          git rm -rf tmp-restore .github/workflows/restore-invite-atomic.yml .github/workflows/RESTORE_INVITE_TRIGGER || true
          git status
          git commit -m "fix(auth): atomic invite claim in acceptInvite (TOCTOU)"
          git push origin HEAD:fix/rbac-isolation-tests-and-org-admin-escalation
