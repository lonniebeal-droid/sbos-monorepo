name: restore-invite-atomic
on:
  push:
    paths:
      - '.github/workflows/RESTORE_INVITE_TRIGGER'
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rbac-isolation-tests-and-org-admin-escalation
      - name: Decode and restore
        run: |
          python3 << 'PY'
          import base64, gzip, pathlib
          mapping = {
            "tmp-restore/auth.service.ts.gz.b64": "apps/api/src/modules/auth/auth.service.ts",
            "tmp-restore/users.service.ts.gz.b64": "apps/api/src/modules/users/users.service.ts",
            "tmp-restore/auth.service.spec.ts.gz.b64": "apps/api/src/modules/auth/auth.service.spec.ts",
          }
          for src, dest in mapping.items():
              b64 = pathlib.Path(src).read_text().strip()
              data = gzip.decompress(base64.b64decode(b64))
              pathlib.Path(dest).write_bytes(data)
              print(dest, len(data))
          PY
      - name: Commit restore and remove temp
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/modules/auth/auth.service.ts apps/api/src/modules/users/users.service.ts apps/api/src/modules/auth/auth.service.spec.ts
          git rm -f tmp-restore/*.gz.b64 .github/workflows/restore-invite-atomic.yml .github/workflows/RESTORE_INVITE_TRIGGER || true
          git commit -m "fix(auth): atomic invite claim in acceptInvite (TOCTOU)"
          git push origin HEAD:fix/rbac-isolation-tests-and-org-admin-escalation
